<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />

    <title>はなしてみよう</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>はなしてみよう</h1>

    <button id="start" class="start">はじめる</button>
    <button id="stop" class="stop" disabled>おわる</button>

    <p id="output" class="output">ここにけっかがでるよ！</p>
    <p id="mic" class="annotation"><img src="img/mic.svg" class="icon">ききとりちゅう...</p>
    <p id="wait" class="annotation"><img src="img/wait.svg" class="icon">かいせきちゅう...</p>
    <p id="error" class="annotation"><img src="img/error.svg" class="icon">うまくききとれませんでした。もういちど！</p>
    <script src="script.js"></script>
  </body>
</html>
